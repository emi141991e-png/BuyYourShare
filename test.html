<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyYourShare - Test Suite & Diagnostic Panel</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body { padding: 24px 16px 60px; font-family: Inter, sans-serif; background: #f8fafc; }
    .test-box { background: white; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 20px; }
    .test-item { padding: 10px 14px; border-radius: var(--radius-md); margin-bottom: 8px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .test-item.pass { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
    .test-item.fail { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .test-summary { font-size: 16px; font-weight: 800; padding: 14px; border-radius: var(--radius-md); text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div>
        <h1 style="font-size:22px; font-weight:900;">🧪 BuyYourShare Diagnostic Test Suite</h1>
        <p style="font-size:13px; color:var(--text-secondary);">Verifica automatica motori di calcolo, database, permessi chat e accesso.</p>
      </div>
      <a href="index.html" class="btn btn-secondary btn-sm">← Torna all'App</a>
    </div>

    <div class="test-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="font-size:16px; font-weight:800;">Esecuzione Test Automatici</h2>
        <button id="btnRunTests" class="btn btn-primary btn-sm">Riesegui Test</button>
      </div>
      
      <div id="testResultsList">Caricamento test in corso...</div>
      <div id="testSummaryBox" class="test-summary"></div>
    </div>
  </div>

  <script type="module">
    import { runAllTests } from './tests/engine.test.js';
    import { db } from './js/db/database.js';

    function executeSuite() {
      const results = runAllTests();
      const listEl = document.getElementById('testResultsList');
      const summaryEl = document.getElementById('testSummaryBox');

      let passed = 0;
      let failed = 0;

      listEl.innerHTML = results.map(r => {
        if (r.status === 'PASS') passed++; else failed++;
        return `
          <div class="test-item ${r.status.toLowerCase()}">
            <span>${r.status === 'PASS' ? '✅' : '❌'} ${r.name}</span>
            <span style="font-size:11px; color:var(--text-muted);">${r.details || ''}</span>
          </div>
        `;
      }).join('');

      summaryEl.className = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
      summaryEl.textContent = `RISULTATO: ${passed} PASSATI, ${failed} FALLITI (${failed === 0 ? '100% SUCCESSO' : 'ATTENZIONE: ERRORI RILEVATI'})`;
    }

    document.getElementById('btnRunTests').onclick = executeSuite;
    executeSuite();
  </script>
</body>
</html>
